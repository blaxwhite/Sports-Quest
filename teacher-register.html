<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Registration | SPORTS QUEST</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2b6666,#0b2030 65%);min-height:100vh;color:#fff1d9;font:16px system-ui}header{padding:20px;background:#0b2534;border-bottom:2px solid #bd995e}a{color:#f3d08d}main{max-width:560px;margin:45px auto;padding:0 16px}.card{background:#153748;border:1px solid #5a8488;border-radius:18px;padding:27px}h1{font-size:clamp(30px,6vw,45px)}p{line-height:1.6;color:#cbdedb}label{display:block;margin:15px 0 6px;font-weight:700}input{display:block;width:100%;padding:13px;border-radius:9px;border:1px solid #83a0a2;background:#0b2634;color:white;font:inherit}button{border:0;border-radius:9px;padding:13px 18px;background:#f2cc80;color:#102939;font:800 15px system-ui;cursor:pointer;margin:14px 8px 0 0}button:disabled{opacity:.6}.hidden{display:none}#status{color:#ffe0a0;white-space:pre-wrap}</style></head><body><header><a href="portal.html">← SPORTS QUEST Welcome Portal</a></header><main><section class="card"><h1>Teacher Registration</h1><p>Create your teacher account, verify your email, then activate your dashboard. No administrator approval is needed.</p><form id="register"><label for="name">Full name</label><input id="name" maxlength="60" minlength="2" required autocomplete="name"><label for="email">Email address</label><input id="email" type="email" required autocomplete="email"><label for="password">Password (at least 12 characters)</label><input id="password" type="password" minlength="12" required autocomplete="new-password"><button id="create" type="submit">Create account & send verification</button></form><div id="verify" class="hidden"><p>Check your email and open the Firebase verification link. Return here afterwards.</p><button id="check" type="button">I've verified my email · Activate account</button><button id="resend" type="button">Resend verification email</button></div><p id="status" role="status"></p><p><a href="teacher-dashboard.html">Already approved? Teacher sign in</a></p></section></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,sendEmailVerification,signOut,reload} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,setDoc,serverTimestamp,getDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
import {firebaseConfig} from './assets/js/firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
let busy=false;
function showUser(user){$('register').classList.toggle('hidden',!!user);$('verify').classList.toggle('hidden',!user);if(user)$('status').textContent='Signed in as '+user.email+'. Verify your email to submit your application.'}
onAuthStateChanged(auth,user=>{if(user&&!user.isAnonymous)showUser(user);else showUser(null)});
$('register').addEventListener('submit',async e=>{e.preventDefault();if(busy)return;busy=true;$('create').disabled=true;try{const name=$('name').value.trim();if(name.length<2||name.length>60)throw Error('Enter a name between 2 and 60 characters.');const result=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);sessionStorage.setItem('sqTeacherApplicantName',name);await sendEmailVerification(result.user);showUser(result.user);$('status').textContent='Verification email sent. Please verify before submitting.'}catch(e){$('status').textContent='Registration failed: '+(e.code||e.message)}finally{busy=false;$('create').disabled=false}});
$('resend').addEventListener('click',async()=>{try{await sendEmailVerification(auth.currentUser);$('status').textContent='Verification email sent again.'}catch(e){$('status').textContent='Could not resend: '+(e.code||e.message)}});
$('check').addEventListener('click',async()=>{const btn=$('check');btn.disabled=true;try{const user=auth.currentUser;if(!user||user.isAnonymous)throw Error('Please register with an email account.');await reload(user);await user.getIdToken(true);if(!user.emailVerified)throw Error('Your email is not verified yet. Check your inbox.');const existing=await getDoc(doc(db,'teachers',user.uid));if(existing.exists()){$('status').textContent='Your teacher account is ready. Sign in to the Teacher Dashboard.';return}let name=(sessionStorage.getItem('sqTeacherApplicantName')||'').trim();if(!name){name=prompt('Enter your teacher display name:')?.trim()||''}if(name.length<2||name.length>60)throw Error('Name must be 2 to 60 characters.');await setDoc(doc(db,'teachers',user.uid),{role:'teacher',active:true,displayName:name,email:user.email,createdAt:serverTimestamp()});$('status').textContent='Teacher account activated! You can now sign in to your dashboard.'}catch(e){$('status').textContent='Could not submit: '+(e.code||e.message)}finally{btn.disabled=false}});
</script></body></html>
